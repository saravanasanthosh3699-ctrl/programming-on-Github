<html>
    <head>
            <link rel="stylesheet" href="style.css">
            <script src = "calculator.js"></script>
    </head>  
    
    <body >

    <div class="calculator">
    <center>
    <table>
     <tr>
          <td> <input type="text" id="display" placeholder="enter your number"> 
     </tr> <br>
    </table>
    
    <table >
    <tr>
        <button onclick="clearDisplay += 'AC' "> AC </button>  <button onclick="display.value += '*' "> * </button>  <button onclick="display.value += '/' "> / </button>  <button onclick="display.value += '%' "> % </button> <br>
    </tr>
    </table>
    
     

   <table >
    <tr >
        <td><button onclick="display.value += '7' "> 7 </button>  <button onclick="display.value += '8' "> 8 </button> <button onclick="display.value += '9' "> 9 </button> <button onclick="display.value += '=' "> = </button> </td> <br>
    </tr >
    </table>

<table >
     <tr>
        <td><button onclick="display.value += '4' " > 4 </button>  <button onclick="display.value += '5' "> 5 </button onclick="display.value += '6' "> <button onclick="display.value += '6' "> 6 </button> <button onclick="display.value += '+' "> + </button> </td> <br>
    </tr>
    </table>

   <table >
     <tr>
        <td><button onclick="display.value += '1' "> 1 </button>  <button onclick="display.value += '2' "> 2 </button> <button onclick="display.value += '3' "> 3</button> <button onclick="display.value += '-' "> - </button> </td> <br>
    </tr>
    </table>

     <table>
     <tr>
        <td><button onclick="display.value += '()' "> () </button>  <button onclick="display.value += '0' "> 0 </button> <button onclick="display.value += '.' ">  . </button>  </td> <br>
    </tr>
    </table>
    </center>

    </body> 
    </table>
